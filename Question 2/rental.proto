syntax = "proto3";

package rental;


// Rental Accommodation System — gRPC contract (Question 2)
// Ministry of Tourism: Hosts list properties, Guests browse and book.


// Enums 

enum PropertyType {
    PROPERTY_TYPE_UNSPECIFIED = 0;
    APARTMENT = 1;
    HOUSE = 2;
    ROOM = 3;
    VILLA = 4;
    LODGE = 5;
}

enum PropertyStatus {
    PROPERTY_STATUS_UNSPECIFIED = 0;
    AVAILABLE = 1;
    BOOKED = 2;
    INACTIVE = 3;
}

enum UserRole {
    USER_ROLE_UNSPECIFIED = 0;
    HOST = 1;
    GUEST = 2;
}

// Property messages 

message Property {
    string property_id = 1;
    string host_id = 2;
    string name = 3;
    string location = 4;
    PropertyType property_type = 5;
    double price_per_night = 6;
    PropertyStatus status = 7;
}

// Payload for add_property. No property_id yet — the server assigns one.
message NewProperty {
    string host_id = 1;
    string name = 2;
    string location = 3;
    PropertyType property_type = 4;
    double price_per_night = 5;
    PropertyStatus status = 6;
}

message PropertyId {
    string property_id = 1;
}

// Fields left at their zero value (empty string / 0 / UNSPECIFIED) are
// treated by the server as "leave unchanged".
message UpdatePropertyRequest {
    string property_id = 1;
    string host_id = 2;
    string name = 3;
    string location = 4;
    PropertyType property_type = 5;
    double price_per_night = 6;
    PropertyStatus status = 7;
}

message RemovePropertyRequest {
    string property_id = 1;
    string host_id = 2;
}

message PropertyList {
    repeated Property properties = 1;
}

// location/min_price/max_price left blank or 0 mean "no filter".
message PropertyFilter {
    string location = 1;
    double min_price = 2;
    double max_price = 3;
}

message SearchRequest {
    string property_id = 1;
}

message SearchResponse {
    bool available = 1;
    string message = 2;
    Property property = 3;
}

// User messages 

message UserProfile {
    string user_id = 1;
    string name = 2;
    string email = 3;
    UserRole role = 4;
}

message Confirmation {
    bool success = 1;
    int32 users_registered = 2;
    string message = 3;
}

// Booking messages 

message BookingRequest {
    string guest_id = 1;
    string property_id = 2;
    string check_in = 3;   // YYYY-MM-DD
    string check_out = 4;  // YYYY-MM-DD
}

// Returned by book_property: the request sitting in the temporary cart.
message BookingCartEntry {
    string booking_id = 1;
    bool accepted = 2;
    string message = 3;
}

message ConfirmBookingRequest {
    string booking_id = 1;
}

message BookingConfirmation {
    bool success = 1;
    string booking_id = 2;
    string property_id = 3;
    int32 nights = 4;
    double total_cost = 5;
    string message = 6;
}

// Service 

service RentalService {
    // Simple RPC — Host lists a new property, gets back its property_id.
    rpc add_property (NewProperty) returns (PropertyId);

    // Client-streaming — bulk-register Hosts/Guests, one confirmation at the end.
    rpc create_users (stream UserProfile) returns (Confirmation);

    // Simple RPC — Host edits an existing listing.
    rpc update_property (UpdatePropertyRequest) returns (Property);

    // Simple RPC — Host deletes a listing; server returns the Host's remaining
    // available listings.
    rpc remove_property (RemovePropertyRequest) returns (PropertyList);

    // Server-streaming — Guest browses available properties, optionally
    // filtered by location or price range.
    rpc list_available_properties (PropertyFilter) returns (stream Property);

    // Simple RPC — Guest looks up one property by id.
    rpc search_property (SearchRequest) returns (SearchResponse);

    // Simple RPC — Guest requests dates; server validates and holds it in a
    // temporary booking cart.
    rpc book_property (BookingRequest) returns (BookingCartEntry);

    // Simple RPC — finalizes a cart entry: re-checks availability, prices it,
    // and clears the cart.
    rpc confirm_booking (ConfirmBookingRequest) returns (BookingConfirmation);
}